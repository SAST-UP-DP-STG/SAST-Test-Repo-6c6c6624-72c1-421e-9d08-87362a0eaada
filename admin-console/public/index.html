<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Internal Admin Console</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page">
      <header>
        <h1>Internal Admin Console</h1>
        <p class="subtitle">
          Customer support tooling for managing user records and API access.
        </p>
      </header>

      <section class="card" id="dashboard">
        <div class="card-header">
          <div>
            <h2>Dashboard</h2>
            <p class="subtitle">
              Current user records.
            </p>
          </div>
          <div class="links">
            <a class="link" href="/login">Switch account</a>
            <a class="link" href="/dev-console.html">Developer console</a>
          </div>
        </div>

        <div class="message" id="action-message"></div>

        <div class="forms">
          <form id="delete-form" class="card form-card">
            <h3>Delete user</h3>
            <label>
              User ID
              <input type="number" name="userId" required />
            </label>
            <button type="submit" class="danger">Delete user</button>
          </form>

          <form id="create-form" class="card form-card">
            <h3>Create user</h3>
            <div class="form-grid">
              <label>
                Name
                <input type="text" name="name" required />
              </label>
              <label>
                Email
                <input type="email" name="email" required />
              </label>
              <label>
                Username
                <input type="text" name="username" required />
              </label>
              <label>
                Password
                <input type="text" name="password" required />
              </label>
              <label>
                Card Last4
                <input type="text" name="last4" maxlength="4" required />
              </label>
              <label>
                SSN Last4
                <input type="text" name="ssn_last4" maxlength="4" required />
              </label>
              <label>
                Role
                <select name="role" required>
                  <option value="user" selected>user</option>
                  <option value="admin">admin</option>
                </select>
              </label>
            </div>
            <button type="submit">Create user</button>
          </form>

          <form id="role-form" class="card form-card">
            <h3>Change role</h3>
            <label>
              User ID
              <input type="number" name="userId" required />
            </label>
            <label>
              New role
              <select name="role" required>
                <option value="user">user</option>
                <option value="admin">admin</option>
              </select>
            </label>
            <button type="submit">Update role</button>
          </form>
        </div>

        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Card Last4</th>
              <th>SSN Last4</th>
              <th>Role</th>
            </tr>
          </thead>
          <tbody id="records-body"></tbody>
        </table>
      </section>
    </div>

    <script>
      const actionMessage = document.getElementById("action-message");
      const dashboard = document.getElementById("dashboard");
      const recordsBody = document.getElementById("records-body");
      const deleteForm = document.getElementById("delete-form");
      const createForm = document.getElementById("create-form");
      const roleForm = document.getElementById("role-form");

      let sessionToken = sessionStorage.getItem("sessionToken") || "";

      function setMessage(target, text, tone = "info") {
        target.textContent = text;
        target.className = `message ${tone}`;
      }

      async function loadRecords() {
        const response = await fetch("/api/records");
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "Unable to load records.");
        }

        recordsBody.innerHTML = "";
        data.users.forEach((user) => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${user.id}</td>
            <td>${user.name}</td>
            <td>${user.email}</td>
            <td>${user.last4}</td>
            <td>${user.ssn_last4}</td>
            <td>${user.role}</td>
          `;
          recordsBody.appendChild(row);
        });
      }

      dashboard.style.display = "block";
      loadRecords().catch((error) => {
        setMessage(actionMessage, error.message, "error");
      });

      deleteForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const formData = new FormData(deleteForm);
        try {
          const response = await fetch("/api/users/delete", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-Session-Token": sessionToken,
            },
            body: JSON.stringify({ id: Number(formData.get("userId")) }),
          });
          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error || "Delete failed.");
          }
          setMessage(actionMessage, "User deleted.", "success");
          deleteForm.reset();
          await loadRecords();
        } catch (error) {
          setMessage(actionMessage, error.message, "error");
        }
      });

      createForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const formData = new FormData(createForm);
        const payload = {
          name: formData.get("name"),
          email: formData.get("email"),
          username: formData.get("username"),
          password: formData.get("password"),
          last4: formData.get("last4"),
          ssn_last4: formData.get("ssn_last4"),
          role: formData.get("role"),
        };

        try {
          const response = await fetch("/api/users/create", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-Session-Token": sessionToken,
            },
            body: JSON.stringify(payload),
          });
          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error || "Create failed.");
          }
          setMessage(actionMessage, `User created (id ${data.userId}).`, "success");
          createForm.reset();
          await loadRecords();
        } catch (error) {
          setMessage(actionMessage, error.message, "error");
        }
      });

      roleForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const formData = new FormData(roleForm);
        const payload = {
          id: Number(formData.get("userId")),
          role: formData.get("role"),
        };

        try {
          const response = await fetch("/api/users/role", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-Session-Token": sessionToken,
            },
            body: JSON.stringify(payload),
          });
          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error || "Role update failed.");
          }
          setMessage(actionMessage, "Role updated.", "success");
          roleForm.reset();
          await loadRecords();
        } catch (error) {
          setMessage(actionMessage, error.message, "error");
        }
      });
    </script>
  </body>
</html>
